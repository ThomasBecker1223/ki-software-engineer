<div
  role="group"
  aria-label="Appearance"
  class="relative isolate inline-grid grid-cols-2 rounded-full border border-line bg-muted-surface p-1 shadow-inner"
>
  <span
    aria-hidden="true"
    class="pointer-events-none absolute inset-y-1 left-1 w-[calc((100%-0.5rem)/2)] rounded-full bg-surface shadow-sm ring-1 ring-line transition-transform duration-200 ease-out motion-reduce:transition-none"
    [style.transform]="theme.preference() === 'dark' ? 'translateX(100%)' : 'translateX(0)'"
  ></span>
  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.aria-label]="option.label"
      [title]="option.label"
      [attr.aria-pressed]="theme.preference() === option.value"
      [class.text-accent]="theme.preference() === option.value"
      [class.text-ink-muted]="theme.preference() !== option.value"
      (click)="theme.setPreference(option.value)"
      class="relative z-10 flex h-11 w-11 items-center justify-center rounded-full transition-colors hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none"
    >
      <svg
        aria-hidden="true"
        class="h-5 w-5 shrink-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path [attr.d]="option.icon" />
      </svg>
    </button>
  }
</div>
